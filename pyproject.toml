[project]
name = "water-column-sonar-ai"
version = "26.11.6"
authors = [
  { name="Rudy Klucik", email="rudy.klucik@noaa.gov" },
]
maintainers = [
  { name="Rudy Klucik", email="rudy.klucik@noaa.gov" },
]
description = "Machine Learning and AI tool for analyzing water column sonar data."
keywords = ["ocean", "sonar", "water column"]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

# uv sync --all-groups --upgrade
dependencies = [
    "aiobotocore",
#    "aiohttp[speedups]",
    "boto3",
    "botocore",
#    "echopype",
#    "fiona",
#    "geopandas",
    "keras",
    "mock",
    "moto[all,server]",
#    "multidict==6.4.3",
#    "netcdf4",
#    "networkx",
#    "numcodecs==0.15.1", # problem with blosc
    "numpy",
    "pandas",
    "pyarrow",
#    "pykalman",
    "python-dotenv",
#    "requests==2.32.3",
    "s3fs==2026.9.0", # Note: problem here, uv finds the wrong one
    "scipy",
#    "setuptools",
#    "shapely",
    "tensorflow",
    "xarray",
    "xbatcher[tensorflow]",
    "zarr",
]

[dependency-groups]
dev = [
    "bandit[toml]",
    "bandit",
    "pooch",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "tqdm",
]


[project.urls]
Homepage = "https://echo.fish"
Repository = "https://github.com/CI-CMG/water-column-sonar-ai"
Issues = "https://github.com/CI-CMG/water-column-sonar-ai/issues"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pre-commit-hooks.bandit]
exclude = ["*/tests/*"]

[tool.isort]
known_first_party = "water_column_sonar_ai"
multi_line_output = 3
force_grid_wrap = 0
include_trailing_comma = true
combine_as_imports = true

[tool.black]
line-length = 88
